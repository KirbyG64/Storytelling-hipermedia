<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cazadores - Hipermedia 6I</title>
<style>
:root{--bg:#fffbd6;--tx:#111;--box:#fff;--bd:#c00;--btn:#ffd54a;--hl:#0033cc;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d2a1d;--tx:#f2f2f2;--box:#2b3b2b;--bd:#ff6b6b;--btn:#c9a227;--hl:#8fb4ff}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--tx);font-family:Verdana,Geneva,Arial,sans-serif;max-width:640px;margin:0 auto;padding:12px;text-align:center}
h1{color:var(--bd);text-shadow:2px 2px #0003;font-size:28px;margin:8px 0}
.sub{font-size:14px;margin-bottom:12px}
#caja{background:var(--box);border:4px dashed var(--bd);padding:14px;margin:10px 0;text-align:left;font-size:17px;line-height:1.5}
#caja h2{color:var(--hl);text-align:center;margin-top:0;text-decoration:underline}
.emoji{font-size:48px;text-align:center;display:block}
button{display:block;width:100%;margin:8px 0;padding:10px;font-family:inherit;font-size:16px;background:var(--btn);color:#111;border:3px outset #888;cursor:pointer}
button:hover{background:#ff9d4a}
button:focus-visible{outline:3px solid var(--hl)}
.final{color:var(--bd);font-weight:bold;text-align:center;font-size:20px}
.pie{font-size:12px;margin-top:20px}
#camino{font-size:13px;font-style:italic}
</style>
</head>
<body>
<h1>La Caza del Tigrex</h1>
<div class="sub">Historia interactiva de Monster Hunter<br>Hecho por Gabriel Gomez y Mateo Ruiz Diaz - 6I</div>

<div id="caja"></div>
<div id="opciones"></div>
<div id="camino"></div>

<div class="pie">Hipermedia - Storytelling interactivo<br>Hay 5 finales distintos, ¿cuántos encontrás?</div>

<script>
var escenas = {
 inicio: {
  titulo: "El bosque tranquilo",
  texto: "En un bosque tranquilo, el cazador rojo recorre el sendero junto a su fiel Felyne. Todo parece estar en calma... hasta que un enorme estruendo rompe el silencio y se escucha un rugido en las montañas. ¿Qué decide hacer?",
  op: [["A - Correr hacia las montañas a ver qué pasó", "campo"], ["B - Ignorarlo y seguir por el sendero", "final1"]]
 },
 campo: {
  titulo: "El campo de batalla",
  texto: "Llegás a las montañas y ves a un Tigrex enfrentándose a dos cazadores. El cazador azul está en el suelo, muy herido. El cazador naranja pelea solo y ya se resignó a esperar el golpe final. El Tigrex se prepara para atacar. ¿Cómo intervenís?",
  op: [["A - Atacar al Tigrex de frente", "duro"], ["B - Tirar una bomba de humo y rescatar primero a los heridos", "rescate"]]
 },
 duro: {
  titulo: "Un combate durísimo",
  texto: "Te lanzás de frente y el Tigrex te recibe con un golpe brutal. Es muy fuerte y el cazador rojo ya está agotado. Tu Felyne te mira preocupado. ¿Qué hacés?",
  op: [["A - Dar todo en un último ataque con ayuda del Felyne", "final2"], ["B - Retirarse con los heridos", "final3"]]
 },
 rescate: {
  titulo: "Rescate exitoso",
  texto: "La bomba de humo confunde al Tigrex. Sacás al cazador azul y al naranja del peligro y les das pociones. El azul se recupera y el naranja recobra las fuerzas. Ahora son cuatro contra el monstruo. ¿Qué plan usan?",
  op: [["A - Atacar los cuatro juntos al Tigrex", "final4"], ["B - Usar una trampa con el Felyne como señuelo", "final5"]]
 },
 final1: {
  titulo: "FINAL 1: El silencio",
  texto: "Seguiste caminando como si nada. Pero el Tigrex terminó bajando al bosque y nadie pudo ayudar a los cazadores. Quizás tendrías que haber ido a ver qué pasaba...",
  final: "Final malo"
 },
 final2: {
  titulo: "FINAL 2: Victoria a duras penas",
  texto: "Con las últimas fuerzas y con la ayuda de su Felyne, el cazador rojo hace un último y poderoso ataque. El rugido del Tigrex se apaga entre las montañas. Los cazadores sobreviven gracias a la valentía del cazador rojo y de su inseparable compañero. (Este es el final del guion original)",
  final: "Final regular"
 },
 final3: {
  titulo: "FINAL 3: La retirada",
  texto: "Decidiste no arriesgarte más y te retiraste con los heridos. Todos sobrevivieron, pero el Tigrex sigue libre en las montañas...",
  final: "Final regular"
 },
 final4: {
  titulo: "FINAL 4: Victoria en equipo",
  texto: "Los cuatro cazadores atacan juntos y el Tigrex no puede resistir. Cae derrotado y el rugido se apaga entre las montañas. Los cuatro celebran y el Felyne recibe muchas caricias. ¡El mejor final!",
  final: "Final bueno"
 },
 final5: {
  titulo: "FINAL 5: La caza ingeniosa",
  texto: "El Felyne se hace el valiente y atrae al Tigrex hasta la trampa. ¡CLANG! El monstruo queda atrapado y los cazadores lo derrotan sin heridas graves. El Felyne es el verdadero héroe de la historia.",
  final: "Final bueno"
 }
};

var camino = [];

function mostrar(id){
  var e = escenas[id];
  camino.push(id);
  var h = '<h2>' + e.titulo + '</h2><p>' + e.texto + '</p>';
  if (e.final) h += '<p class="final">' + e.final + ' - FIN</p>';
  document.getElementById("caja").innerHTML = h;

  var o = document.getElementById("opciones");
  o.innerHTML = "";
  if (e.op) {
    e.op.forEach(function(x){
      var b = document.createElement("button");
      b.textContent = x[0];
      b.onclick = function(){ mostrar(x[1]); };
      o.appendChild(b);
    });
  } else {
    var r = document.createElement("button");
    r.textContent = "Volver a jugar";
    r.onclick = function(){ camino = []; mostrar("inicio"); };
    o.appendChild(r);
  }
  document.getElementById("camino").textContent = camino.length > 1 ? "Camino: " + camino.length + " escenas visitadas" : "";
}
mostrar("inicio");
</script>
</body>
</html>
